name: platform

on:
  push:
    paths: ["backend/**", "database/**", "engines/**", "src/**", "web-src/**", "index.html", "start-app.*", "Dockerfile", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["backend/**", "database/**", "engines/**", "src/**", "web-src/**", "index.html"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build engines (EPANET from this repo, SWMM from USEPA v5.2.4)
        run: engines/build_engines.sh
      - name: Install backend
        run: pip install -e backend
      - name: Unit and engine tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: Apply and verify database schema
        env: { PGPASSWORD: postgres }
        run: |
          for f in database/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/verify_schema.sql

  ui-help:
    # Every visible control in index.html must have a help description (docs/platform/UI_GUIDELINES.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Playwright and Chromium
        run: npm install -g playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Audit help coverage
        run: NODE_PATH=$(npm root -g) node web-src/check-help.cjs index.html

  app-ui:
    # The simple app: every state of every module in a real browser, with help coverage and no console errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build engines (EPANET from this repo, SWMM from USEPA v5.2.4)
        run: engines/build_engines.sh
      - name: Install backend and Playwright
        run: pip install -e backend playwright && python -m playwright install --with-deps chromium
      - name: Walk through the app
        working-directory: backend
        run: python ui_audit/check_app.py screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: app-screenshots, path: backend/screenshots }

  windows:
    # Same tests on Windows, with the engines built by MSVC; the DLLs are published as the
    # "engines-windows" release download, which start-app.bat fetches when they are missing.
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build engines (epanet2.dll, swmm5.dll)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File engines/build_engines.ps1
      - name: Install backend
        run: pip install -e backend
      - name: Unit and engine tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: The engines really run (SWMM and EPANET results in the reports)
        working-directory: backend
        shell: bash
        run: |
          python -m cityinfra.cli drainage --sample -o d.md && grep -q "SWMM results" d.md
          python -m cityinfra.cli water --sample > w.txt && grep -qi "EPANET" w.txt
      - uses: actions/upload-artifact@v4
        with: { name: engines-windows, path: engines/lib }
      - name: Publish the DLLs as a release download
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          (cd engines/lib && 7z a ../../engines-windows.zip epanet2.dll swmm5.dll)
          gh release view engines-windows >/dev/null 2>&1 || gh release create engines-windows --prerelease \
            --target "${{ github.sha }}" --title "Calculation engines for Windows (EPANET 2.3, EPA SWMM 5.2.4)" \
            --notes "epanet2.dll (built from this repository) and swmm5.dll (USEPA SWMM v5.2.4), 64-bit, built by the platform workflow. start-app.bat downloads them automatically into engines/lib."
          gh release upload engines-windows engines-windows.zip --clobber
      - name: start-app.bat can fetch the published engines
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force engines/lib
          powershell -ExecutionPolicy Bypass -File engines/get_engines_windows.ps1
          if (-not (Test-Path engines/lib/swmm5.dll) -or -not (Test-Path engines/lib/epanet2.dll)) { exit 1 }

      - name: start-app.bat starts the designer
        shell: pwsh
        run: |
          Start-Process cmd -ArgumentList '/c', 'start-app.bat', '--no-browser', '--port', '8790'
          for ($i = 0; $i -lt 40; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8790/api/modules | Out-Null; exit 0 } catch { Start-Sleep 2 } }
          exit 1

  docker:
    # The web-service image builds and answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cityinfra .
      - name: Start and ask for a check
        run: |
          docker run -d -p 8765:8765 --name app cityinfra
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/modules >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/example/drainage -o ex.json
          curl -sf -X POST -H 'Content-Type: application/json' --data @ex.json http://127.0.0.1:8765/api/check/drainage | head -c 300
