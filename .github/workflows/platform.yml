name: platform

on:
  push:
    paths: ["backend/**", "database/**", "engines/**", "src/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["backend/**", "database/**", "engines/**", "src/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build engines (EPANET from this repo, SWMM from USEPA v5.2.4)
        run: engines/build_engines.sh
      - name: Install backend
        run: pip install -e backend
      - name: Unit and engine tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: Apply and verify database schema
        env: { PGPASSWORD: postgres }
        run: |
          for f in database/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/verify_schema.sql
