    <div class="flex min-w-0 items-center gap-2">
      <svg class="h-6 w-6 shrink-0 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3c3.5 4.2 6 7.4 6 10.4A6 6 0 0 1 6 13.4C6 10.4 8.5 7.2 12 3Z"/><path d="M9 14.5a3 3 0 0 0 3 2.5"/></svg>
      <div class="min-w-0">
        <h1 class="text-[15px] font-semibold leading-tight">EPANET Network Designer</h1>
        <input id="net-title" aria-label="Network name" class="w-56 max-w-full truncate bg-transparent text-xs text-muted outline-none focus:text-ink" spellcheck="false">
      </div>
    </div>
    <nav class="ml-auto flex flex-wrap items-center gap-1.5" aria-label="File">
      <button id="btn-new" class="btn">New network</button>
      <button id="btn-sample" class="btn">Load sample</button>
      <label class="btn cursor-pointer" for="inp-import">Import .INP<input id="inp-import" type="file" accept=".inp,.INP,text/plain" class="sr-only"></label>
      <button id="btn-export" class="btn">Export .INP</button>
      <button id="btn-run" class="btn-primary"><svg class="h-3.5 w-3.5" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L4.9 2.3a.6.6 0 0 0-.9.5Z"/></svg>Run simulation</button>
    </nav>
  </header>

  <!-- Inline confirmation / notices -->
  <div id="notice" hidden class="flex flex-wrap items-center gap-3 border-b border-line bg-sunk px-4 py-2 text-sm">
    <span id="notice-text"></span>
    <span id="notice-actions" class="ml-auto flex gap-2"></span>
  </div>

  <main class="grid grid-cols-1 lg:min-h-0 lg:flex-1 lg:grid-cols-[auto_minmax(0,1fr)_20rem]">
    <!-- Tools -->
    <aside class="flex gap-1 overflow-x-auto border-b border-line bg-panel p-2 lg:flex-col lg:border-b-0 lg:border-r" aria-label="Drawing tools" id="tools">
      <button class="tool" data-tool="select" title="Select and move (S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l13 8-6 1.5L9 19z" fill="currentColor"/></svg><span>Select</span><kbd>S</kbd></button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="junction" title="Add junction (J)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg><span>Junction</span><kbd>J</kbd></button>
      <button class="tool" data-tool="reservoir" title="Add reservoir / source (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-2 10H6z" fill="currentColor"/><path d="M3 8h18" stroke="currentColor" stroke-width="2"/></svg><span>Reservoir</span><kbd>R</kbd></button>
      <button class="tool" data-tool="tank" title="Add storage tank / ESR (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="10" rx="1.5" fill="currentColor"/><path d="M9 14v6M15 14v6M7 20h10" stroke="currentColor" stroke-width="2"/></svg><span>Tank</span><kbd>T</kbd></button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="pipe" title="Draw pipe between nodes (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="2.5" fill="currentColor"/><circle cx="19" cy="5" r="2.5" fill="currentColor"/><path d="M5 19L19 5" stroke="currentColor" stroke-width="2.5"/></svg><span>Pipe</span><kbd>P</kbd></button>
      <button class="tool" data-tool="pump" title="Add pump between nodes (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg><span>Pump</span><kbd>M</kbd></button>
      <button class="tool" data-tool="valve" title="Add valve between nodes (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7v10l8-5zM20 7v10l-8-5z" fill="currentColor"/></svg><span>Valve</span><kbd>V</kbd></button>
      <div class="tool-sep"></div>
      <button class="tool" id="btn-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" transform="translate(0 -3)"/></svg><span>Undo</span></button>
      <button class="tool" id="btn-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 12" fill="none" stroke="currentColor" stroke-width="2" transform="translate(0 -3)"/></svg><span>Redo</span></button>
    </aside>

    <!-- Canvas -->
    <section class="relative h-[62vh] min-h-[22rem] overflow-hidden bg-canvas lg:h-auto" aria-label="Network plan">
      <svg id="canvas" class="absolute inset-0 h-full w-full touch-none select-none" role="application" aria-label="Network drawing area"></svg>
      <div id="hint" class="pointer-events-none absolute left-3 top-3 max-w-[calc(100%-9rem)] rounded-md bg-panel/90 px-2.5 py-1.5 text-xs text-muted shadow-sm ring-1 ring-line"></div>
      <div class="absolute bottom-3 right-3 flex overflow-hidden rounded-md bg-panel shadow-sm ring-1 ring-line">
        <button id="zoom-in" class="zbtn" aria-label="Zoom in">+</button>
        <button id="zoom-out" class="zbtn border-l border-line" aria-label="Zoom out">−</button>
        <button id="zoom-fit" class="zbtn border-l border-line px-2.5 text-xs" aria-label="Fit network to view">Fit</button>
      </div>
      <div id="legend" hidden class="absolute bottom-3 left-3 rounded-md bg-panel/95 px-3 py-2 text-xs shadow-sm ring-1 ring-line"></div>
    </section>

    <!-- Inspector -->
    <aside id="inspector" class="overflow-y-auto lg:min-h-0 border-t border-line bg-panel lg:border-l lg:border-t-0" aria-label="Properties"></aside>
  </main>

  <!-- Results dock -->
  <section id="dock" class="flex h-[17rem] min-h-0 flex-col border-t border-line bg-panel" aria-label="Simulation results">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 border-b border-line px-3 py-1.5">
      <div role="tablist" class="flex gap-0.5" id="tabs">
        <button role="tab" class="tab" data-tab="log">Log</button>
        <button role="tab" class="tab" data-tab="nodes">Nodes</button>
        <button role="tab" class="tab" data-tab="links">Links</button>
        <button role="tab" class="tab" data-tab="graph">Graph</button>
      </div>
      <span id="run-state" class="pill"></span>
      <div id="time-ctl" class="ml-auto flex items-center gap-2 text-xs" hidden>
        <button id="play" class="zbtn h-7 w-7 rounded-md ring-1 ring-line" aria-label="Play through time steps">▶</button>
        <label for="time-range" class="text-muted">Time</label>
        <input id="time-range" type="range" min="0" max="0" value="0" class="w-32 accent-[var(--accent)] sm:w-48">
        <select id="time-select" aria-label="Time step" class="rounded-md border border-line bg-panel px-1.5 py-1 font-mono text-xs"></select>
      </div>
    </div>
    <div class="min-h-0 flex-1 overflow-auto">
      <div data-panel="log" class="h-full"><pre id="log" class="h-full whitespace-pre-wrap px-4 py-2 font-mono text-xs leading-relaxed text-muted"></pre></div>
      <div data-panel="nodes" hidden></div>
      <div data-panel="links" hidden></div>
      <div data-panel="graph" hidden class="h-full p-3"></div>
    </div>
  </section>

  <!-- Export dialog -->
  <div id="export-modal" hidden class="fixed inset-0 z-20 flex items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-full w-full max-w-2xl flex-col rounded-lg bg-panel shadow-xl ring-1 ring-line" role="dialog" aria-modal="true" aria-labelledby="export-title">
      <div class="flex items-center gap-2 border-b border-line px-4 py-3">
        <h2 id="export-title" class="font-semibold">EPANET input file</h2>
        <button id="export-close" class="ml-auto text-muted hover:text-ink" aria-label="Close">✕</button>
      </div>
      <textarea id="export-text" readonly class="min-h-[18rem] flex-1 resize-none bg-sunk p-3 font-mono text-xs text-ink outline-none" spellcheck="false"></textarea>
      <div class="flex flex-wrap items-center gap-2 border-t border-line px-4 py-3 text-xs text-muted">
        <span class="mr-auto">Opens in EPANET 2.2/2.3 and any tool that reads .INP files.</span>
        <button id="export-copy" class="btn">Copy text</button>
        <button id="export-download" class="btn-primary">Download .inp</button>
      </div>
    </div>
  </div>
</div>
