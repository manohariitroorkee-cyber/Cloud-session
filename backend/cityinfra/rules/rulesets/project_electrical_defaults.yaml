# Project decisions for electrical distribution – confirm per project and with
# the distribution licensee's (e.g. discom's) requirements.
id: project_electrical_defaults
title: Project electrical design decisions (defaults – confirm per project)
source_document: Project design basis report

parameters:
  demand_factors:
    value: {residential: 0.6, commercial: 0.7, institutional: 0.7, streetlight: 1.0, pumping: 1.0, ev_charging: 1.0}
    unit: "-"
    description: Maximum demand ÷ connected load, by load category
    source: {clause: "Design basis", note: "Set from the licensee's norms / project load study"}
    verification: project_decision

  diversity_factors:
    value: {feeder_pillar: 1.2, pole: 1.2, transformer: 1.3, substation: 1.1}
    unit: "-"
    description: Diversity factor applied at each level (sum of downstream maximum demands ÷ this factor)
    source: {clause: "Design basis"}
    verification: project_decision

  default_power_factor:
    value: 0.9
    unit: "-"
    description: Power factor used where a load does not state one
    source: {clause: "Design basis"}
    verification: project_decision

  cable_derating_factor:
    value: 0.8
    unit: "-"
    description: Combined derating for ground temperature, depth, soil resistivity and grouping
    source: {clause: "Design basis", note: "Compute per route from the manufacturer's / IS derating tables"}
    verification: project_decision

  voltage_drop_limit_pct:
    value: {lt: 5.0, ht: 5.0}
    unit: "%"
    description: Maximum cumulative voltage drop from source bus to load (LT) / to transformer (HT)
    source: {clause: "Design basis", note: "Choose so that supply stays within the CEA (Measures relating to Safety and Electric Supply) Regulations voltage-variation limits – limits not verified in this software"}
    verification: project_decision

  transformer_max_loading:
    value: 0.8
    unit: fraction of rating
    description: Maximum transformer loading at design demand
    source: {clause: "Design basis"}
    verification: project_decision

  transformer_ratings_kva:
    value: [100, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000]
    unit: kVA
    description: Distribution transformer ratings available for proposals
    source: {clause: "Design basis", note: "Match to the licensee's approved ratings"}
    verification: project_decision
